name: Frontend CI

on:
  push:
    branches:
      - feat/archive-communities-and-groups-2026-11-12
      - fix/safe-whatsapp-community-reuse-2026-11-12
      - fix/community-clean-restart-2026-11-12
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Netlify API syntax
        run: node --check netlify/functions/api.mjs
      - name: Build frontend
        run: bun run build
      - name: Run tests
        run: bun run test -- --passWithNoTests
