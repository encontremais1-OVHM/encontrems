name: Validate frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Netlify function syntax
        run: |
          node --check netlify/lib/baileys.mjs
          node --check netlify/functions/api.mjs
          node --check netlify/functions/enforce-access.mjs
          node --check netlify/functions/registration-access.mjs
          node --check netlify/functions/manual-removals.mjs
      - name: Build
        run: bun run build
        env:
          NETLIFY: "true"
